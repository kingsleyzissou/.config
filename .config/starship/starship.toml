# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_macchiato"

add_newline = true

[character]
success_symbol = '[➜](bold green)'
error_symbol = "[➜](bold red)"
vimcmd_symbol = "[](bold green)"
vimcmd_replace_one_symbol = "[](bold purple)"
vimcmd_replace_symbol = "[](bold purple)"
vimcmd_visual_symbol = "[](bold lavender)"

[username]
style_user = 'teal bold'
style_root = 'crust bold'
disabled = false
show_always = true

[hostname]
ssh_only = true
disabled = false
format = "[@$hostname >> ]($style)"
style = "bold mauve"
trim_at = "-"

[directory]
truncation_length = 4
style = "bold lavender"

[git_branch]
symbol = ""
truncation_length = 24
format="[[$symbol $branch(:$remote_branch)](bold pink)]($style) "

[git_status]
deleted = "✖"
format = "[($all_status$ahead_behind )]($style)"

[cmd_duration]
format="[$duration]($style)"

[package]
disabled = true

[aws]
disabled = true

[docker_context]
disabled = true

# palette tables should be last in the config ⚓️
[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
