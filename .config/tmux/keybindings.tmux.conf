bind x kill-pane
bind k kill-window
bind ! kill-session
bind q send-keys C-a x Enter
bind r source-file ~/.config/tmux/tmux.conf
bind t select-layout tiled

# Set new panes to open in current directory
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# smart pane switching with awareness of vim splits
bind -n C-h run '(tmux display-message -p "#{pane_current_command} #{pane_title}" | grep -iq nvim && tmux send-keys C-h) || tmux select-pane -L'
bind -n C-j run '(tmux display-message -p "#{pane_current_command} #{pane_title}" | grep -iq nvim && tmux send-keys C-j) || tmux select-pane -D'
bind -n C-k run '(tmux display-message -p "#{pane_current_command} #{pane_title}" | grep -iq nvim && tmux send-keys C-k) || tmux select-pane -U'
bind -n C-l run '(tmux display-message -p "#{pane_current_command} #{pane_title}" | grep -iq nvim && tmux send-keys C-l) || tmux select-pane -R'
