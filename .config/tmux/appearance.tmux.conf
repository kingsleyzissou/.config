# Set basic styles
set -g status-position top
set -g status-justify 'absolute-centre'
set-option -g status-style bg=default

# Configure Online
set -g @online_icon '󰖩 on'
set -g @offline_icon '󰖪 off'

# status left look and feel
# https://github.com/catppuccin/tmux/discussions/317#discussioncomment-11064512
set -g status-left-length 100
set -g status-left ''
set -ga status-left '#{?client_prefix,#{#[bg=default,fg=#{@thm_red},bold]  #S },#{#[bg=default,fg=#{@thm_green}]  #S }}'
set -ga status-left '#[bg=default,fg=#{@thm_gray},none]│'
set -ga status-left '#[bg=default,fg=#{@thm_magenta}]  #{pane_current_command} '
set -ga status-left '#[bg=default,fg=#{@thm_gray},none]│'
set -ga status-left '#[bg=default,fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} '
set -ga status-left '#[bg=default,fg=#{@thm_gray},none]#{?window_zoomed_flag,│,}'
set -ga status-left '#[bg=default,fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}'

# status right look and feel
set -g status-right-length 100
set -g status-right ''
set -ga status-right '#[bg=default,fg=#{@thm_teal}] 󰭦 %y-%m-%d '
set -ga status-right '#[bg=default,fg=#{@thm_gray}, none]│'
set -ga status-right '#[bg=default,fg=#{@thm_flamingo}] 󰅐 %H:%M '

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ''
setw -g pane-active-border-style 'bg=default,fg=#{@thm_gray}'
setw -g pane-border-style 'bg=default,fg=#{@thm_gray}'
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format 'Window'

set -g window-status-format ' #I#{?#{!=:#{window_name},Window},: #W,} '
set -g window-status-style 'bg=default,fg=#{@thm_fg}'
set -g window-status-last-style 'bg=default,fg=#{@thm_fg}'
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator '#[bg=default,fg=#{@thm_gray}]│'

set -g window-status-current-format ' #I#{?#{!=:#{window_name},Window},: #W,} '
set -g window-status-current-style 'bg=#{@thm_pink},fg=#{@thm_bg},bold'
